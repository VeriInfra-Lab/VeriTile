name: Artifact

on:
  push:
    branches:
      - main
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/**'
      - 'site/scripts/check-doc-api.py'
      - 'site/src/content/docs/cookbook/**'
      - '.github/workflows/**'
      - 'documents/**'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/**'
      - 'site/scripts/check-doc-api.py'
      - 'site/src/content/docs/cookbook/**'
      - '.github/workflows/**'
      - 'documents/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      body_migration_only:
        description: Replay only the explicit body-migration batch; not a corpus completion gate
        type: boolean
        default: false
      body_migration_batch:
        description: Select all staged cases or only the current incremental proof batch
        type: choice
        options:
          - all_staged
          - incremental
        default: all_staged

jobs:
  check:
    name: Lean artifact checks
    if: github.event_name != 'workflow_dispatch' || !inputs.body_migration_only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install required audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          command -v rg && command -v python3

      - name: Check audit runner regressions
        run: |
          python3 -m unittest discover -s scripts -p 'test_audit_source.py'
          python3 -m unittest discover -s scripts -p 'test_correctness_surface_audit.py'
          python3 -m unittest discover -s scripts -p 'test_source_dtype_audit.py'
          python3 -m unittest discover -s scripts -p 'test_source_helpers.py'
          python3 -m unittest discover -s scripts -p 'test_source_materializations.py'
          python3 -m unittest discover -s scripts -p 'test_source_control_materializations.py'
          python3 -m unittest discover -s scripts -p 'test_source_uniform_materializations.py'
          python3 -m unittest discover -s scripts -p 'test_audit_shards.py'

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "VeriTile VeriTileFull bench.examples.VectorAdd.Kernels bench.tritonbench_g.softmax_triton1.Kernels"
          test: false
          lint: false
          use-mathlib-cache: auto

      - name: Set up official proof comparator
        uses: ./.github/actions/setup-comparator

      - name: Check artifact contract with comparator
        run: scripts/check-artifact.sh

      - name: Replay independent mathematics after kernel retirement
        run: |
          for source in \
            bench/tritonbench_g/batched_vecmat_mult/Proofs/Mathematical_RealFoundation.lean \
            bench/tritonbench_g/bgmv_shrink_kernel/Sources/Mathematical_RealFoundation.lean \
            bench/tritonbench_g/chunk_bwd_dqkg/Proofs/RealFragments.lean \
            bench/tritonbench_g/chunk_cumsum_kernel/Proofs/ChunkMath.lean \
            bench/tritonbench_g/int8_matmul_quantization/Sources/Mathematical_Int8MatmulQuantization.lean \
            bench/tritonbench_g/int_scaled_matmul/Sources/Mathematical_IntScaledMatmul.lean \
            bench/tritonbench_g/layernorm_fwd_triton/Proofs/Mathematical_LayernormFwdTriton.lean \
            bench/tritonbench_g/lora_expand_gemv/Sources/Mathematical_LoraExpandGemv.lean \
            bench/tritonbench_g/matmul_dequant_int4/Sources/Mathematical_MatmulDequantInt4.lean \
            bench/tritonbench_g/matmul_dequantize/Sources/Mathematical_MatmulDequantize.lean \
            bench/tritonbench_g/matmul_dequantize_int4/Sources/Mathematical_MatmulDequantizeInt4.lean \
            bench/tritonbench_g/rope_transform/Proofs/Mathematical_RopeTransform.lean \
            bench/tritonbench_g/softmax_optimize/Proofs/Mathematical_LegacyReal.lean \
            bench/tritonbench_g/softmax_triton1/Proofs/Mathematical_Real.lean \
            bench/tritonbench_g/softmax_triton2/Proofs/Mathematical_Real.lean \
            bench/tritonbench_g/softmax_triton3/Proofs/Mathematical_Spec.lean; do
            python3 scripts/check_comparator.py --file "$source" --trust \
              --workspace "$RUNNER_TEMP/standalone-math-replay"
          done

      - name: Check audit and documentation regressions
        run: |
          lake build tests.lean.StatementAudit
          lake build tests.lean.KernelIOProjection
          lake build tests.lean.DTypeResolution
          lake build tests.lean.FloatNegativeScalar
          lake build tests.lean.Float32FiniteDecode
          lake build tests.lean.PhiloxRandom
          lake build tests.lean.PhiloxRandOp
          lake build tests.lean.RandomFrontend
          lake build tests.lean.DirectRandomFrontend
          lake build tests.lean.ConditionalCast
          lake build tests.lean.BuiltinFloatZero
          lake build tests.lean.RegisterDTypeWhere
          lake build tests.lean.PointerElementCast
          lake build tests.lean.ReverseRange
          lake build tests.lean.UnsignedIntegerCast
          lake build tests.lean.SignedBitwise
          lake build tests.lean.FloatRuntimeScalar
          lake build tests.lean.FloatDivisionPromotion
          lake build tests.lean.SignedRangeAddressInference
          lake build tests.lean.SignedLoadCast
          lake build tests.lean.LibdevicePowi
          lake build tests.lean.LibdevicePowiDynamic
          lake build tests.lean.KldivRuntimeEpsilon
          lake build tests.lean.ModuleSpecAudit
          lake build tests.lean.ModuleHeadlineAudit
          python3 -m unittest discover -s scripts -p 'test_audit_gates.py'
          python3 -m unittest discover -s scripts -p 'test_doc_api.py'
          python3 -m unittest discover -s scripts -p 'test_coverage_review.py'
          python3 scripts/bench/coverage_review.py
          python3 scripts/test_check_comparator.py

      # The complete selected corpus is independently replayed by Bench audit.
      - name: Check final corpus membership and scope
        run: python3 -B scripts/bench/final_inventory.py --check

  body-migration:
    name: Function-body proof replay ${{ matrix.shard }}
    if: github.event_name == 'workflow_dispatch' && inputs.body_migration_only
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.body_migration_batch == 'incremental' && '[0]' || '[0,1,2,3,4,5]') }}
    env:
      BODY_SHARD_INDEX: ${{ matrix.shard }}
      BODY_SHARD_COUNT: ${{ inputs.body_migration_batch == 'incremental' && 1 || 6 }}
      BODY_MANIFEST: ${{ inputs.body_migration_batch == 'incremental' && 'validation/body-migration-incremental.json' || 'validation/body-migration-batch.json' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate every staged original and candidate function body
        run: python3 scripts/bench/replay_body_migrations.py --check --manifest "$BODY_MANIFEST"
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: auto
      - name: Build all retained modules in the staged cases
        run: |
          python3 scripts/bench/replay_body_migrations.py --build --manifest "$BODY_MANIFEST" \
            --shard-index "$BODY_SHARD_INDEX" --shard-count "$BODY_SHARD_COUNT"
      - uses: ./.github/actions/setup-comparator
      - name: Audit and independently replay the staged proofs
        run: |
          python3 scripts/bench/replay_body_migrations.py --replay --manifest "$BODY_MANIFEST" \
            --shard-index "$BODY_SHARD_INDEX" --shard-count "$BODY_SHARD_COUNT" \
            --workspace "$RUNNER_TEMP/body-migration-judge" \
            --report "$RUNNER_TEMP/body-migration-replay.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: body-migration-proof-replay-${{ matrix.shard }}
          overwrite: true
          path: |
            ${{ runner.temp }}/body-migration-replay.json
            Logs/comparator-check-*/**/result.json
            Logs/comparator-check-*/**/targets.json
          if-no-files-found: warn

  body-migration-receipt:
    name: Require complete official body-migration receipts
    env:
      BODY_MANIFEST: ${{ inputs.body_migration_batch == 'incremental' && 'validation/body-migration-incremental.json' || 'validation/body-migration-batch.json' }}
    needs: body-migration
    if: always() && github.event_name == 'workflow_dispatch' && inputs.body_migration_only
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: body-migration-proof-replay-*
          path: ${{ runner.temp }}/body-migration-shards
      - name: Require every case and shared proof on the same source snapshot
        run: |
          python3 scripts/bench/replay_body_migrations.py --manifest "$BODY_MANIFEST" \
            --merge-reports "$RUNNER_TEMP/body-migration-shards" \
            --report "$RUNNER_TEMP/body-migration-replay.json"
      - uses: actions/upload-artifact@v4
        with:
          name: body-migration-proof-replay
          overwrite: true
          path: ${{ runner.temp }}/body-migration-replay.json
