name: Artifact

on:
  push:
    branches:
      - main
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/**'
      - 'site/scripts/check-doc-api.py'
      - 'site/src/content/docs/cookbook/**'
      - '.github/workflows/**'
      - 'documents/**'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/**'
      - 'site/scripts/check-doc-api.py'
      - 'site/src/content/docs/cookbook/**'
      - '.github/workflows/**'
      - 'documents/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  check:
    name: Lean artifact checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install required audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          command -v rg && command -v python3

      - name: Check audit runner regressions
        run: |
          python3 -m unittest discover -s scripts -p 'test_audit_source.py'
          python3 -m unittest discover -s scripts -p 'test_correctness_surface_audit.py'
          python3 -m unittest discover -s scripts -p 'test_source_dtype_audit.py'
          python3 -m unittest discover -s scripts -p 'test_source_helpers.py'
          python3 -m unittest discover -s scripts -p 'test_source_materializations.py'
          python3 -m unittest discover -s scripts -p 'test_source_control_materializations.py'
          python3 -m unittest discover -s scripts -p 'test_source_uniform_materializations.py'
          python3 -m unittest discover -s scripts -p 'test_audit_shards.py'

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "VeriTile VeriTileFull bench.examples.VectorAdd.Kernels bench.tritonbench_g.softmax_triton1.Kernels"
          test: false
          lint: false
          use-mathlib-cache: auto

      - name: Set up official proof comparator
        uses: ./.github/actions/setup-comparator

      - name: Check artifact contract with comparator
        run: scripts/check-artifact.sh

      - name: Check audit and documentation regressions
        run: |
          lake build bench.tests.StatementAudit
          lake build bench.tests.KernelIOProjection
          lake build bench.tests.DTypeResolution
          lake build bench.tests.FloatNegativeScalar
          lake build bench.tests.Float32FiniteDecode
          lake build bench.tests.PhiloxRandom
          lake build bench.tests.PhiloxRandOp
          lake build bench.tests.RandomFrontend
          lake build bench.tests.DirectRandomFrontend
          lake build bench.tests.ConditionalCast
          lake build bench.tests.BuiltinFloatZero
          lake build bench.tests.RegisterDTypeWhere
          lake build bench.tests.PointerElementCast
          lake build bench.tests.ReverseRange
          lake build bench.tests.UnsignedIntegerCast
          lake build bench.tests.SignedBitwise
          lake build bench.tests.FloatRuntimeScalar
          lake build bench.tests.FloatDivisionPromotion
          lake build bench.tests.SignedRangeAddressInference
          lake build bench.tests.SignedLoadCast
          lake build bench.tests.LibdevicePowi
          lake build bench.tests.LibdevicePowiDynamic
          lake build bench.tests.KldivRuntimeEpsilon
          lake build bench.tests.ModuleSpecAudit
          lake build bench.tests.ModuleHeadlineAudit
          python3 -m unittest discover -s scripts -p 'test_audit_gates.py'
          python3 -m unittest discover -s scripts -p 'test_doc_api.py'
          python3 -m unittest discover -s scripts -p 'test_coverage_review.py'
          python3 bench/coverage_review.py
          python3 scripts/test_check_comparator.py

      # The complete selected corpus is independently replayed by Bench audit.
      - name: Check final corpus membership and scope
        run: python3 -B bench/final_inventory.py --check
