name: Bench audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_audit:
        description: Replay every retained module, including unused helper theorems
        type: boolean
        default: true
  schedule:
    # 04:00 Asia/Singapore; GitHub cron uses UTC.
    - cron: '0 20 * * *'

permissions:
  contents: read

concurrency:
  group: bench-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  global:
    name: Final source gates and library replay
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      full_audit: ${{ steps.scope.outputs.full }}
      audit_mode: ${{ steps.scope.outputs.mode }}
      shard_count: ${{ steps.scope.outputs.count }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - name: Select daily or manually requested full-corpus audit
        id: scope
        env:
          FULL_AUDIT: ${{ inputs.full_audit }}
        run: |
          python3 - <<'PY'
          import json, os
          full = os.environ['GITHUB_EVENT_NAME'] == 'schedule' or os.environ['FULL_AUDIT'] == 'true'
          count = 64 if full else 16
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('full=' + str(full).lower(), file=output)
              print('mode=' + ('--final-inventory' if full else '--ci-targets'), file=output)
              print(f'count={count}', file=output)
              print('shards=' + json.dumps(list(range(count))), file=output)
          PY
      - name: Make room for the complete Lean corpus
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - name: Install required source audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          command -v rg && command -v python3
      - name: Check final source and audit regressions
        run: |
          python3 -B -m unittest discover -s tests/python -p 'test_*.py'
          python3 -B -m unittest discover -s scripts -p 'test_audit_source.py'
          python3 -B -m unittest discover -s scripts -p 'test_audit_shards.py'
          python3 -B -m unittest discover -s scripts -p 'test_comparator_preflight.py'
          bash scripts/bench/audit_tritonbench_g.sh --source-only
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "VeriTile VeriTileMath VeriTileFull"
          test: false
          lint: false
          use-mathlib-cache: auto
      - uses: ./.github/actions/setup-comparator
      - name: Replay library proofs
        run: python3 scripts/check_comparator.py --library
      - name: Build and replay imported precision regressions
        run: |
          lake build tests.lean.ImportedBenchPrecision
          python3 scripts/check_comparator.py \
            --file tests/lean/ImportedBenchPrecision.lean --trust
      - name: Replay matmul source scopes
        run: |
          for task in matmul_triton1 matmul_triton2; do
            lake build "bench.tritonbench_g.$task.Correct" "bench.tritonbench_g.$task.FPEquiv"
            for entry in Correct FPEquiv; do
              python3 scripts/check_comparator.py \
                --file "bench/tritonbench_g/$task/$entry.lean" --trust \
                --workspace "$RUNNER_TEMP/matmul-source-replay"
            done
          done
      - name: Replay rotary source-entry connections
        run: |
          lake build bench.tritonbench_g.rotary_transform_ops.Correct \
            bench.tritonbench_g.rotary_transform_ops.FPEquiv
          for entry in Proofs/SourceEntry Correct FPEquiv; do
            python3 scripts/check_comparator.py \
              --file "bench/tritonbench_g/rotary_transform_ops/$entry.lean" --trust \
              --workspace "$RUNNER_TEMP/rotary-source-replay"
          done
      - name: Replay shared control-flow source connections
        run: |
          lake build tests.lean.ControlSource
          for task in spinning_lock_reduction streamk_matmul; do
            lake build "bench.tritonbench_g.$task.Correct" "bench.tritonbench_g.$task.FPEquiv"
            for entry in Correct FPEquiv; do
              python3 scripts/check_comparator.py \
                --file "bench/tritonbench_g/$task/$entry.lean" --trust \
                --workspace "$RUNNER_TEMP/control-source-replay"
            done
          done
          python3 scripts/check_comparator.py \
            --file bench/tritonbench_g/spinning_lock_reduction/Proofs/SourceEntry.lean --trust \
            --workspace "$RUNNER_TEMP/control-source-replay"
          python3 scripts/check_comparator.py --file tests/lean/ControlSource.lean --trust \
            --workspace "$RUNNER_TEMP/control-source-replay"
      - name: Bind the built snapshot
        run: python3 scripts/bench/final_inventory.py --check

  drafts:
    name: All 334 benchmark interfaces
    needs: global
    if: needs.global.outputs.full_audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the benchmark builds
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "BugDetection PretrainKernels"
          test: false
          lint: false
          use-mathlib-cache: auto
      - name: Check final interfaces and recorded source bindings
        run: |
          python3 bench/bug_detection/check.py --verify-record
          python3 bench/pretrain_kernels/check.py --verify-record
          python3 scripts/bench/check_imported_kernel_review.py

  audit:
    name: Final entry build and replay ${{ matrix.shard }}
    needs: global
    if: needs.global.outputs.full_audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.global.outputs.shards) }}
    env:
      AUDIT_TRUST_JOBS: 1
      AUDIT_TRUST_SHARD_COUNT: ${{ needs.global.outputs.shard_count }}
      AUDIT_TRUST_SHARD_INDEX: ${{ matrix.shard }}
      AUDIT_MODE: ${{ needs.global.outputs.audit_mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Make room for proof replay
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Fetch Mathlib cache with bounded network retries
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: |
          for delay in 0 5 15; do
            sleep "$delay"
            if lake exe cache get; then
              exit 0
            fi
          done
          exit 1
      - name: Build every selected module and its complete dependencies
        run: |
          if [ "$AUDIT_MODE" = --final-inventory ]; then
            python3 scripts/bench/final_inventory.py --targets > "$RUNNER_TEMP/all-targets.txt"
          else
            python3 scripts/bench/final_inventory.py --ci-targets > "$RUNNER_TEMP/all-targets.txt"
          fi
          python3 scripts/bench/select_audit_shard.py "$AUDIT_TRUST_SHARD_COUNT" "$AUDIT_TRUST_SHARD_INDEX" \
            < "$RUNNER_TEMP/all-targets.txt" > "$RUNNER_TEMP/shard-targets.txt"
          test -s "$RUNNER_TEMP/shard-targets.txt"
          sed 's|/|.|g; s|\.lean$||' "$RUNNER_TEMP/shard-targets.txt" | xargs lake build
      - uses: ./.github/actions/setup-comparator
      - name: Replay selected entries and their proof dependencies
        run: scripts/bench/audit_trust.sh "$AUDIT_MODE"

  complete:
    name: TritonBench-G audit complete
    needs: [global, drafts, audit]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    env:
      GLOBAL_RESULT: ${{ needs.global.result }}
      CORPUS_RESULT: ${{ needs.audit.result }}
      DRAFTS_RESULT: ${{ needs.drafts.result }}
      FULL_AUDIT: ${{ needs.global.outputs.full_audit }}
    steps:
      - name: Require every build and proof gate
        run: |
          test "$GLOBAL_RESULT" = success
          if [ "$FULL_AUDIT" = true ]; then
            test "$CORPUS_RESULT" = success
            test "$DRAFTS_RESULT" = success
          else
            test "$FULL_AUDIT" = false
            test "$CORPUS_RESULT" = skipped
            test "$DRAFTS_RESULT" = skipped
          fi
