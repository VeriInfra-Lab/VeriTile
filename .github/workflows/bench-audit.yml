name: Bench audit

# Current-layout gates use an explicit catalog and the 183-task original-program
# scope ledger. Pending/unbound scope reviews fail; frozen historical ledgers
# are not rewritten to accommodate new typed and multi-entry contracts.
# Corpus workers retain the Lean axiom/spec gates and official comparator.
#
# Historical all-target acceptance is retained for explicit diagnostics.
# Main releases use verified-scope.yml; pending original-program acceptance
# is not promoted by the selected proof build.
on:
  workflow_dispatch:

permissions:
  contents: read

# Keep the newest audit for each ref.
concurrency:
  group: bench-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  global:
    name: TritonBench-G global gates
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore immutable historical audit inputs
        run: python3 scripts/restore_historical_evidence.py --download

      - name: Install required audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          command -v rg && command -v python3

      - name: Check audit source and sharding regressions
        run: |
          python3 -B -m unittest discover -s bench/tests -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_audit_source.py'
          python3 -m unittest discover -s scripts -p 'test_correctness_surface_audit.py'
          python3 -m unittest discover -s scripts -p 'test_source_shape_audit.py'
          python3 -m unittest discover -s scripts -p 'test_source_dtype_audit.py'
          python3 -m unittest discover -s scripts -p 'test_source_constexpr_profile.py'
          python3 -m unittest discover -s scripts -p 'test_source_runtime_scalar_profile.py'
          python3 -m unittest discover -s scripts -p 'test_source_helpers.py'
          python3 -m unittest discover -s scripts -p 'test_source_extern_orders.py'
          python3 -m unittest discover -s scripts -p 'test_source_pointer_dtype_profile.py'
          python3 -m unittest discover -s scripts -p 'test_source_materializations.py'
          python3 -m unittest discover -s scripts -p 'test_source_control_materializations.py'
          python3 -m unittest discover -s scripts -p 'test_source_uniform_materializations.py'
          python3 -m unittest discover -s scripts -p 'test_audit_shards.py'
          python3 -m unittest discover -s scripts -p 'test_acceptance_bundle.py'
          python3 -m unittest discover -s scripts -p 'test_comparator_preflight.py'
          python3 scripts/check_triton_softmax_source_profiles.py --output "$RUNNER_TEMP/softmax-source-profiles"

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "VeriTile VeriTileMath VeriTileFull TritonBenchGVerified TritonBenchGInProgress TritonBenchGLegacy TritonBenchSpecExamples FPFrontendRegressions"
          test: false
          lint: false
          use-mathlib-cache: auto

      - name: Set up official proof comparator
        uses: ./.github/actions/setup-comparator

      - name: Run structural and library comparator gates once
        run: |
          python3 -B bench/current_source_audit.py \
            --root . \
            --catalog bench/review-checkpoints/2026-10-16/native-add-value-sin-kernel-cosine-acceptance/current-source-catalog.json.gz \
            --baseline-package bench/review-checkpoints/2026-10-15/original-scope-extensions/metadata-baseline \
            --source-map bench/current_source_selections.json \
            --legacy-inventory bench/tritonbench_g/current_completion_inventory.json \
            --evidence-root bench/review-checkpoints \
            --review-manifest bench/review-checkpoints/2026-10-15/raw-copy-software-metadata/catalog-review-rebased.json \
            --supplement bench/review-checkpoints/2026-10-16/native-add-value-sin-kernel-cosine-acceptance/catalog-supplement.json.gz \
            --scope-ledger bench/original_program_scope.json.gz \
            --output "$RUNNER_TEMP/current-source-global"

  audit:
    name: TritonBench-G audit shard ${{ matrix.shard }}
    # Each shard requires the global gates and checks a disjoint corpus subset.
    needs: global
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      AUDIT_TRUST_JOBS: 1
      AUDIT_TRUST_SHARD_COUNT: 4
      AUDIT_TRUST_SHARD_INDEX: ${{ matrix.shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build corpus dependencies
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "VeriTile"
          test: false
          lint: false
          use-mathlib-cache: auto

      - name: Set up official proof comparator
        uses: ./.github/actions/setup-comparator

      - name: Run corpus shard with comparator
        run: |
          bench/audit_trust.sh --catalog \
            bench/review-checkpoints/2026-10-16/native-add-value-sin-kernel-cosine-acceptance/current-source-catalog.json.gz

  complete:
    name: TritonBench-G audit complete
    needs: [global, audit]
    # A failed, cancelled, or skipped dependency must never become a green gate.
    # Retain the existing policy of running this workflow only for local PRs.
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      GLOBAL_RESULT: ${{ needs.global.result }}
      CORPUS_RESULT: ${{ needs.audit.result }}
    steps:
      - name: Require global gates and all corpus shards
        run: |
          if [[ "$GLOBAL_RESULT" != success || "$CORPUS_RESULT" != success ]]; then
            printf 'Audit incomplete: global=%s, corpus=%s\n' "$GLOBAL_RESULT" "$CORPUS_RESULT"
            exit 1
          fi
          printf 'Global gates and all four corpus shards passed\n'
