# Independent real-correctness and FP-equivalence specification examples.
[[lean_lib]]
name = "TritonBenchSpecExamples"
# Keep benchmark-owned examples outside this package's module search.
globs = [
  "bench.examples.AdamUpdateGridLaunch.+",
  "bench.examples.FlatVectorAdd.+",
  "bench.examples.FloatDTypeAdd.+",
  "bench.examples.FloatDTypeSoftmax.+",
  "bench.examples.FusedLayerNorm.+",
  "bench.examples.FusedSiLU.+",
  "bench.examples.FusedSwiglu.+",
  "bench.examples.HyperConnectionsDepth.+",
  "bench.examples.HyperConnectionsWidth.+",
  "bench.examples.LogExp.+",
  "bench.examples.OnlineSoftmax.+",
  "bench.examples.RowWiseMax.+",
  "bench.examples.RowWiseSum.+",
  "bench.examples.SoftmaxReciprocal.+",
  "bench.examples.SoftmaxStable.+",
  "bench.examples.StableLogSumExp.+",
  "bench.examples.VectorAdd.+",
  "bench.examples.Welford.+",
]

# Full target: Lite + Math + ApproxGeLU. Build this when working on the
# GeLU error bound or before any release tagging.
#
# `VeriTile.Meta.TrustReport` (the generated whole-library trust gate — runs
# `#axiomsClean` on every proven library theorem) lives here because it imports
# ApproxGeLU. `lake build VeriTile.Meta.TrustReport` builds its dependencies and
# runs the audit in one step; keeping it out of the lite lib preserves the
# lite/full split.
[[lean_lib]]
name = "VeriTileFull"
globs = [
  "VeriTile.Examples.ApproxGeLU",
  "VeriTile.Examples.ApproxGeLU.+",
  "VeriTile.Meta.TrustReport",
]

