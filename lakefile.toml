# Independent real-correctness and FP-equivalence specification examples.
[[lean_lib]]
name = "TritonBenchSpecExamples"
globs = ["bench.examples.+"]
roots = [
  "bench.examples.TritonBenchVectorAddition.Correct",
  "bench.examples.TritonBenchVectorAddition.FPEquiv",
]

# Independent Triton lowerings and unsolved Real/FP/counterexample challenges.
[[lean_lib]]
name = "BugDetection"
globs = ["bench.bug_detection.+"]
roots = ["bench.bug_detection.All", "bench.bug_detection.Validation"]

# Independent pretraining equivalence problems; proof/backend goals are unsolved.
[[lean_lib]]
name = "PretrainKernels"
globs = ["bench.pretrain_kernels.+"]
roots = ["bench.pretrain_kernels.All", "bench.pretrain_kernels.Validation"]
weakLeanArgs = ["--tstack=65536"]

# Full target: Lite + Math + ApproxGeLU. Build this when working on the
# GeLU error bound or before any release tagging.
#
# `VeriTile.Meta.TrustReport` (the generated whole-library trust gate — runs
# `#axiomsClean` on every proven library theorem) lives here because it imports
# ApproxGeLU. `lake build VeriTile.Meta.TrustReport` builds its dependencies and
# runs the audit in one step; keeping it out of the lite lib preserves the
# lite/full split.
[[lean_lib]]
name = "VeriTileFull"
globs = [
  "VeriTile.Examples.ApproxGeLU",
  "VeriTile.Examples.ApproxGeLU.+",
  "VeriTile.Meta.TrustReport",
]

# Final selected tasks and their complete retained proof dependency closure.
# Selection and numerical scope are checked by scripts/bench/final_inventory.py.
[[lean_lib]]
name = "TritonBenchGFinal"
globs = ["bench.tritonbench_g.+"]

[[lean_lib]]
name = "FinalRegressions"
globs = ["tests.lean.+"]
